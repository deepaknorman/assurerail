# AssureRail venue — self-contained container stack (its OWN Postgres, ring-fenced from AssureLocker).
#
#   docker compose -f docker-compose.assurerail.yml up --build
#
# Ports on the host:  api → 3006, web → 3007, db → 5442 (5432 inside; 5442 avoids clashing with the
# another local Postgres on 5432). Secrets are supplied at runtime, never baked into images:
#   - copy real values into a root .env (docker compose auto-loads it for ${VAR} interpolation), or
#   - drop apps/assurerail-api/.env.docker for API server secrets and provider credentials.
# All adapters default to DEMO, so the stack runs end-to-end with zero external credentials.

name: assurerail

services:
  assurerail-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: assurerail
      POSTGRES_PASSWORD: ${ASSURERAIL_DB_PASSWORD:-assurerail_dev}
      POSTGRES_DB: assurerail_venue
    volumes:
      - assurerail-db-data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assurerail -d assurerail_venue"]
      interval: 5s
      timeout: 5s
      retries: 12

  assurerail-api:
    build:
      context: .
      dockerfile: apps/assurerail-api/Dockerfile
    restart: unless-stopped
    depends_on:
      assurerail-db:
        condition: service_healthy
    environment:
      # NODE_ENV controls runtime optimisation; the explicit AssureRail mode controls evidence and
      # allowed capabilities. This compose stack is an isolated DEMO even though the Node build is
      # optimised. CONTROLLED_LIVE/PRODUCTION fail closed on demo adapters/routes and missing auth.
      NODE_ENV: ${NODE_ENV:-production}
      ASSURERAIL_OPERATING_MODE: ${ASSURERAIL_OPERATING_MODE:-DEMO}
      ARAIL_DEMO_ENDPOINTS_ENABLED: ${ARAIL_DEMO_ENDPOINTS_ENABLED:-true}
      # Product/runtime controls are always explicit in the effective container environment. Safe
      # defaults preserve the current DEMO posture; changing a value does not bypass the dependency,
      # operating-mode, activation-manifest or external-evidence checks in the API.
      ARAIL_NEUTRAL_TAXONOMY_V1: ${ARAIL_NEUTRAL_TAXONOMY_V1:-off}
      ARAIL_NEUTRAL_INGRESS_V1: ${ARAIL_NEUTRAL_INGRESS_V1:-off}
      ARAIL_TRANSACTION_CASE_V1: ${ARAIL_TRANSACTION_CASE_V1:-off}
      ARAIL_EXTERNAL_ACTION_SAGA_V1: ${ARAIL_EXTERNAL_ACTION_SAGA_V1:-off}
      ARAIL_DA_REPLAY_V1: ${ARAIL_DA_REPLAY_V1:-off}
      ARAIL_PTC_REPLAY_V1: ${ARAIL_PTC_REPLAY_V1:-off}
      ARAIL_DURABLE_RELAY_MODE: ${ARAIL_DURABLE_RELAY_MODE:-legacy}
      ARAIL_PARTICIPANT_ADMISSION_V1: ${ARAIL_PARTICIPANT_ADMISSION_V1:-off}
      ARAIL_ROUTE_ENTITLEMENT_ENFORCE: ${ARAIL_ROUTE_ENTITLEMENT_ENFORCE:-off}
      ARAIL_ROOM_READ_SOURCE: ${ARAIL_ROOM_READ_SOURCE:-legacy}
      ARAIL_ROOM_WRITE_SOURCE: ${ARAIL_ROOM_WRITE_SOURCE:-legacy}
      ARAIL_COMPLETION_ACK_V1: ${ARAIL_COMPLETION_ACK_V1:-off}
      ARAIL_LEGACY_ROOM_PROXY_V1: ${ARAIL_LEGACY_ROOM_PROXY_V1:-off}
      ARAIL_TOKENISED_DA_V1: ${ARAIL_TOKENISED_DA_V1:-off}
      ARAIL_TOKENISED_PTC_V1: ${ARAIL_TOKENISED_PTC_V1:-off}
      ARAIL_PRIMARY_COMMERCIAL_V1: ${ARAIL_PRIMARY_COMMERCIAL_V1:-off}
      ARAIL_CONVENTIONAL_SECONDARY_V1: ${ARAIL_CONVENTIONAL_SECONDARY_V1:-off}
      ARAIL_VENUE_CONDUCT_V1: ${ARAIL_VENUE_CONDUCT_V1:-off}
      ARAIL_DEVELOPER_PORTAL_V1: ${ARAIL_DEVELOPER_PORTAL_V1:-off}
      ARAIL_CUSTOMER_OPERATIONS_V1: ${ARAIL_CUSTOMER_OPERATIONS_V1:-off}
      ARAIL_HOSTED_ALPHA_V1: ${ARAIL_HOSTED_ALPHA_V1:-off}
      ARAIL_INSTITUTIONAL_PRODUCT_V1: ${ARAIL_INSTITUTIONAL_PRODUCT_V1:-off}
      ARAIL_DA_PRODUCT_V1: ${ARAIL_DA_PRODUCT_V1:-off}
      ARAIL_PTC_PRODUCT_V1: ${ARAIL_PTC_PRODUCT_V1:-off}
      ARAIL_LIFECYCLE_PRODUCT_V1: ${ARAIL_LIFECYCLE_PRODUCT_V1:-off}
      ARAIL_PRIMARY_VENUE_PRODUCT_V1: ${ARAIL_PRIMARY_VENUE_PRODUCT_V1:-off}
      ARAIL_SECONDARY_PRODUCT_V1: ${ARAIL_SECONDARY_PRODUCT_V1:-off}
      ARAIL_TOKENISED_PRODUCT_V1: ${ARAIL_TOKENISED_PRODUCT_V1:-off}
      ARAIL_ENTERPRISE_INTEGRATION_V1: ${ARAIL_ENTERPRISE_INTEGRATION_V1:-off}
      ARAIL_PRODUCTION_SCALE_V1: ${ARAIL_PRODUCTION_SCALE_V1:-off}
      ARAIL_LENS_MONITORING_CONNECTOR_V1: ${ARAIL_LENS_MONITORING_CONNECTOR_V1:-off}
      ARAIL_ASSUREPOOL_PTC_PREPARATION_CONNECTOR_V1: ${ARAIL_ASSUREPOOL_PTC_PREPARATION_CONNECTOR_V1:-off}
      ARAIL_INTERNAL_RBAC_V1: ${ARAIL_INTERNAL_RBAC_V1:-off}
      PORT: "3006"
      DATABASE_URL: "postgresql://assurerail:${ASSURERAIL_DB_PASSWORD:-assurerail_dev}@assurerail-db:5432/assurerail_venue?connection_limit=10&pool_timeout=10"
      # Adapters — DEMO by default (deterministic, no external calls).
      TAPE_SOURCE: ${TAPE_SOURCE:-demo}
      HTS_ADAPTER: ${HTS_ADAPTER:-demo}
      HCS_ANCHOR: ${HCS_ANCHOR:-demo}
      SETTLEMENT_ADAPTER: ${SETTLEMENT_ADAPTER:-demo}
      DIGIKYC_GATE: ${DIGIKYC_GATE:-demo}
      SETTLEMENT_TOKEN: ${SETTLEMENT_TOKEN:-eRupee}
      SEED_ON_BOOT: ${SEED_ON_BOOT:-true}
      TAPE_PROVIDER_API_URL: ${TAPE_PROVIDER_API_URL:-http://host.docker.internal:3000}
      TAPE_PROVIDER_API_KEY: ${TAPE_PROVIDER_API_KEY:-}
      IDENTITY_PROVIDER_API_URL: ${IDENTITY_PROVIDER_API_URL:-http://host.docker.internal:3000}
      IDENTITY_PROVIDER_API_KEY: ${IDENTITY_PROVIDER_API_KEY:-}
      ANCHOR_PROVIDER_API_URL: ${ANCHOR_PROVIDER_API_URL:-http://host.docker.internal:3003}
      ANCHOR_PROVIDER_API_KEY: ${ANCHOR_PROVIDER_API_KEY:-}
      SETTLEMENT_PROVIDER_API_URL: ${SETTLEMENT_PROVIDER_API_URL:-http://host.docker.internal:3003}
      SETTLEMENT_PROVIDER_API_KEY: ${SETTLEMENT_PROVIDER_API_KEY:-}
      DIGIKYC_STATUS_SERVICE_SECRET: ${DIGIKYC_STATUS_SERVICE_SECRET:-}
      ARAIL_ASSURELENS_TRUSTED_KEYS_JSON: ${ARAIL_ASSURELENS_TRUSTED_KEYS_JSON:-}
      ARAIL_ASSUREPOOL_TRUSTED_KEYS_JSON: ${ARAIL_ASSUREPOOL_TRUSTED_KEYS_JSON:-}
      # The identity gate stays demo unless its independent provider credentials are configured.
    # Optional server secrets (never committed). Object form → the file is optional.
    env_file:
      - path: ./apps/assurerail-api/.env.docker
        required: false
    # Apply migrations before boot, then start the server.
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/main.js"]
    ports:
      - "3006:3006"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3006/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

  assurerail-web:
    build:
      context: .
      dockerfile: apps/assurerail/Dockerfile
      args:
        # NEXT_PUBLIC_* are build-time (inlined). Structural identifiers default inside the Dockerfile;
        # the two high-entropy values (Firebase apiKey + reCAPTCHA site key) have no default — supply them
        # via root .env to enable auth/captcha. All are public-by-design but never hardcoded in a tracked file.
        NEXT_PUBLIC_ASSURERAIL_VENUE_URL: ${NEXT_PUBLIC_ASSURERAIL_VENUE_URL:-http://localhost:3006}
        NEXT_PUBLIC_ASSURERAIL_CUSTOMER_WORKSPACE_V1: ${NEXT_PUBLIC_ASSURERAIL_CUSTOMER_WORKSPACE_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_CUSTOMER_OPERATIONS_V1: ${NEXT_PUBLIC_ASSURERAIL_CUSTOMER_OPERATIONS_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_HOSTED_ALPHA_V1: ${NEXT_PUBLIC_ASSURERAIL_HOSTED_ALPHA_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_INSTITUTIONAL_PRODUCT_V1: ${NEXT_PUBLIC_ASSURERAIL_INSTITUTIONAL_PRODUCT_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_DA_PRODUCT_V1: ${NEXT_PUBLIC_ASSURERAIL_DA_PRODUCT_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_PTC_PRODUCT_V1: ${NEXT_PUBLIC_ASSURERAIL_PTC_PRODUCT_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_LIFECYCLE_PRODUCT_V1: ${NEXT_PUBLIC_ASSURERAIL_LIFECYCLE_PRODUCT_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_PRIMARY_VENUE_PRODUCT_V1: ${NEXT_PUBLIC_ASSURERAIL_PRIMARY_VENUE_PRODUCT_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_SECONDARY_PRODUCT_V1: ${NEXT_PUBLIC_ASSURERAIL_SECONDARY_PRODUCT_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_TOKENISED_PRODUCT_V1: ${NEXT_PUBLIC_ASSURERAIL_TOKENISED_PRODUCT_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_ENTERPRISE_INTEGRATION_V1: ${NEXT_PUBLIC_ASSURERAIL_ENTERPRISE_INTEGRATION_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_PRODUCTION_SCALE_V1: ${NEXT_PUBLIC_ASSURERAIL_PRODUCTION_SCALE_V1:-off}
        NEXT_PUBLIC_ASSURERAIL_CONTACT_EMAIL: ${NEXT_PUBLIC_ASSURERAIL_CONTACT_EMAIL:-}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_RECAPTCHA_SITE_KEY:-}
    restart: unless-stopped
    depends_on:
      - assurerail-api
    environment:
      NODE_ENV: production
      PORT: "3007"
      HOSTNAME: 0.0.0.0
      ASSURERAIL_INBOUND_ENABLED: ${ASSURERAIL_INBOUND_ENABLED:-no}
      ASSURERAIL_CONTACT_EMAIL: ${ASSURERAIL_CONTACT_EMAIL:-}
      ASSURERAIL_PUBLIC_ORIGINS: ${ASSURERAIL_PUBLIC_ORIGINS:-http://localhost:3007}
      ASSURERAIL_INBOUND_WEBHOOK_URL: ${ASSURERAIL_INBOUND_WEBHOOK_URL:-}
      ASSURERAIL_INBOUND_ALLOWED_HOSTS: ${ASSURERAIL_INBOUND_ALLOWED_HOSTS:-}
      ASSURERAIL_INBOUND_WEBHOOK_SECRET: ${ASSURERAIL_INBOUND_WEBHOOK_SECRET:-}
      ASSURERAIL_PRIVATE_UI_ENABLED: ${ASSURERAIL_PRIVATE_UI_ENABLED:-no}
      ASSURERAIL_DILIGENCE_ENABLED: ${ASSURERAIL_DILIGENCE_ENABLED:-no}
      ASSURERAIL_DILIGENCE_USERNAME: ${ASSURERAIL_DILIGENCE_USERNAME:-}
      ASSURERAIL_DILIGENCE_PASSWORD: ${ASSURERAIL_DILIGENCE_PASSWORD:-}
    ports:
      - "3007:3007"

volumes:
  assurerail-db-data:
