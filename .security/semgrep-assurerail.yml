rules:
  - id: assurerail-no-dynamic-code-execution
    message: Dynamic code execution is prohibited in AssureRail application code.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: assurerail-no-tls-verification-bypass
    message: TLS certificate verification must not be disabled.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: "{..., rejectUnauthorized: false, ...}"
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
  - id: assurerail-no-permissive-cors-literal
    message: A literal wildcard CORS origin is prohibited; use the governed origin allow-list.
    severity: ERROR
    languages: [javascript, typescript]
    patterns:
      - pattern-either:
          - pattern: '$APP.enableCors({..., origin: "*", ...})'
          - pattern: '$APP.enableCors({..., origin: true, ...})'
      - pattern-not-inside: |
          if (process.env.ASSURERAIL_CORS_ANY === "true") {
            ...
          }
  - id: assurerail-no-shell-exec
    message: Avoid shell command execution in application code; use a bounded non-shell API.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: exec(...)
      - pattern: execSync(...)
    paths:
      include:
        - /apps/assurerail/src/**
        - /apps/assurerail-api/src/**
  - id: assurerail-no-unsafe-prisma-raw-query
    message: Unsafe Prisma raw-query APIs are prohibited; use parameterised tagged-template methods.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: $DB.$queryRawUnsafe(...)
      - pattern: $DB.$executeRawUnsafe(...)
  - id: assurerail-no-react-raw-html
    message: Raw HTML insertion requires a separately reviewed sanitisation boundary.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - patterns:
          - pattern: |
              <$EL dangerouslySetInnerHTML={{__html: $HTML}} />
          - pattern-not: |
              <$EL dangerouslySetInnerHTML={{__html: "..."}} />
          - pattern-not: |
              <script type="application/ld+json" dangerouslySetInnerHTML={{__html: JSON.stringify(...).replace(/</g, "\\u003c")}} />
      - pattern: $NODE.innerHTML = $VALUE
  - id: assurerail-no-weak-cryptographic-hash
    message: MD5 and SHA-1 are prohibited for integrity or signature evidence.
    severity: ERROR
    languages: [javascript, typescript]
    pattern-either:
      - pattern: $CRYPTO.createHash("md5")
      - pattern: $CRYPTO.createHash("sha1")
